name: Build Hostinger static branch
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hostinger-static
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test tests/*.test.mjs
      - name: Publish compiled files to hostinger branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code --heads origin hostinger; then
            git fetch origin hostinger
            git worktree add /tmp/hazardpath-deploy origin/hostinger
          else
            git worktree add --detach /tmp/hazardpath-deploy
            git -C /tmp/hazardpath-deploy checkout --orphan hostinger
            git -C /tmp/hazardpath-deploy read-tree --empty
          fi
          rsync -a --delete --exclude=.git dist/client/ /tmp/hazardpath-deploy/
          git -C /tmp/hazardpath-deploy add -A
          if ! git -C /tmp/hazardpath-deploy diff --cached --quiet; then
            git -C /tmp/hazardpath-deploy commit -m "Build ${GITHUB_SHA} for Hostinger"
            git -C /tmp/hazardpath-deploy push origin HEAD:hostinger
          fi
